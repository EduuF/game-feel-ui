<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E11"/>
      <stop offset="55%" stop-color="#131318"/>
      <stop offset="100%" stop-color="#0B0B0E"/>
    </linearGradient>
    <radialGradient id="glowVermilion" cx="68%" cy="45%" r="38%">
      <stop offset="0%" stop-color="#FF5722" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FF5722" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIndigo" cx="82%" cy="55%" r="35%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="28%" stop-color="#FF5722"/>
      <stop offset="65%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#F4F2ED" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="460" rx="20" fill="url(#bgGrad)" stroke="#2A2A32" stroke-width="2"/>
  <rect width="1200" height="460" rx="20" fill="url(#dotGrid)"/>
  <rect width="1200" height="460" rx="20" fill="url(#glowVermilion)"/>
  <rect width="1200" height="460" rx="20" fill="url(#glowIndigo)"/>

  <!-- Left Editorial Column -->
  <g transform="translate(64, 68)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="290" height="30" rx="15" fill="#1A1A20" stroke="#34343F" stroke-width="1"/>
    <circle cx="16" cy="15" r="4.5" fill="#FF5722"/>
    <text x="30" y="19" fill="#D5D2CD" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.4">AGENT SKILL · CLAUDE CODE &amp; CURSOR</text>

    <!-- Title -->
    <text x="0" y="92" fill="#F4F2ED" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-size="54" font-weight="700" letter-spacing="-2">game-feel-ui</text>
    <text x="0" y="138" fill="#A6A29B" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="28">The physics of the first 120 milliseconds.</text>

    <!-- Subtitle -->
    <text x="0" y="184" fill="#8E8B84" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15.5">39 Game Dev mechanics—Hitstop, Squash &amp; Stretch, Coyote Time,</text>
    <text x="0" y="208" fill="#8E8B84" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15.5">and 0 KB Web Audio synthesis—engineered for modern web &amp; mobile UI.</text>

    <!-- Terminal Pill -->
    <rect x="0" y="242" width="420" height="48" rx="10" fill="#09090B" stroke="#32323D" stroke-width="1.5"/>
    <text x="18" y="271" fill="#FF5722" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600">$</text>
    <text x="36" y="271" fill="#F4F2ED" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">npx skills add EduuF/game-feel-ui</text>

    <!-- Metrics Footer -->
    <g transform="translate(0, 322)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#8E8B84">
      <text x="0" y="0"><tspan fill="#F4F2ED" font-weight="600">39</tspan> MECHANICS</text>
      <text x="118" y="0">·</text>
      <text x="134" y="0"><tspan fill="#F4F2ED" font-weight="600">23</tspan> COMPONENTS</text>
      <text x="258" y="0">·</text>
      <text x="274" y="0"><tspan fill="#F4F2ED" font-weight="600">11</tspan> STACKS</text>
      <text x="368" y="0">·</text>
      <text x="384" y="0"><tspan fill="#10B981" font-weight="600">0 KB</tspan> AUDIO ASSETS</text>
    </g>
  </g>

  <!-- Right Column: Oscilloscope Card -->
  <g transform="translate(600, 52)">
    <rect x="0" y="0" width="540" height="356" rx="16" fill="#121216" stroke="#2D2D38" stroke-width="1.5"/>
    <!-- Window Header -->
    <rect x="0" y="0" width="540" height="38" rx="16" fill="#18181E"/>
    <circle cx="20" cy="19" r="5" fill="#FF5F57"/>
    <circle cx="36" cy="19" r="5" fill="#FFBD2E"/>
    <circle cx="52" cy="19" r="5" fill="#28C840"/>
    <text x="270" y="23" text-anchor="middle" fill="#8E8B84" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">120ms KINEMATIC OSCILLOSCOPE · 60FPS</text>

    <!-- Baseline 1.0x -->
    <line x1="36" y1="195" x2="504" y2="195" stroke="#2E2E3A" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="42" y="186" fill="#686662" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">scale(1.00) · rest state</text>

    <!-- Zone Dividers -->
    <line x1="145" y1="58" x2="145" y2="285" stroke="#F59E0B" stroke-opacity="0.25" stroke-width="1"/>
    <line x1="235" y1="58" x2="235" y2="285" stroke="#FF5722" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="385" y1="58" x2="385" y2="285" stroke="#6366F1" stroke-opacity="0.25" stroke-width="1"/>

    <!-- Hitstop Highlight Zone -->
    <rect x="145" y="58" width="90" height="227" fill="#FF5722" fill-opacity="0.07"/>

    <!-- Physics Curve: Anticipation Squash -> Hitstop Freeze -> Spring Overshoot -> Settle -->
    <path d="M 36 195 C 65 195, 95 252, 145 252 L 235 252 C 265 252, 285 96, 325 96 C 360 96, 375 212, 410 188 C 438 178, 465 195, 504 195" fill="none" stroke="url(#curveGrad)" stroke-width="4" stroke-linecap="round"/>

    <!-- Keyframe Nodes -->
    <circle cx="145" cy="252" r="6" fill="#F59E0B" stroke="#121216" stroke-width="2"/>
    <circle cx="235" cy="252" r="6" fill="#FF5722" stroke="#121216" stroke-width="2"/>
    <circle cx="325" cy="96" r="6" fill="#6366F1" stroke="#121216" stroke-width="2"/>
    <circle cx="485" cy="195" r="6" fill="#10B981" stroke="#121216" stroke-width="2"/>

    <!-- Phase Labels -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">
      <text x="52" y="76" fill="#F59E0B">01. ANTICIPATION</text>
      <text x="52" y="92" fill="#8E8B84">scale(0.94)</text>

      <text x="154" y="76" fill="#FF5722" font-weight="600">02. HITSTOP</text>
      <text x="154" y="92" fill="#D5D2CD">75ms freeze</text>

      <text x="250" y="76" fill="#818CF8">03. SPRING REBOUND</text>
      <text x="250" y="92" fill="#8E8B84">overshoot 1.06x</text>

      <text x="398" y="76" fill="#10B981">04. SYNTH TRIAD</text>
      <text x="398" y="92" fill="#8E8B84">523Hz → 784Hz</text>
    </g>

    <!-- Bottom Telemetry Readout -->
    <rect x="24" y="300" width="492" height="36" rx="8" fill="#0B0B0E" stroke="#252530" stroke-width="1"/>
    <text x="40" y="322" fill="#10B981" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">● LIVE SANDBOX</text>
    <text x="165" y="322" fill="#D5D2CD" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">--juice 5  ·  --forgiveness 8 (160ms Coyote)  ·  --audio 4</text>
  </g>
</svg>
